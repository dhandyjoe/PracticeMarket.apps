# Subflow: reset data, lalu masuk dengan akun hasil Register (-e EMAIL=… -e PASSWORD=…; tidak ada akun uji bersama).
appId: com.automation.practice
---
- launchApp:
    clearState: true
- openLink: practiceapp://settings?deterministic=true&latency=0&flaky=0
- extendedWaitUntil:
    visible:
      id: shop_btn_skip
    timeout: 10000
- tapOn:
    id: shop_btn_skip
- tapOn:
    id: shop_input_username
- inputText: ${EMAIL}
- tapOn:
    id: shop_input_password
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: shop_btn_login
- assertVisible:
    id: shop_txt_greeting
