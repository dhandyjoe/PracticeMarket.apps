appId: com.automation.practice
---
- runFlow:
    file: _login.yaml
    when:
      true: ${typeof LOGGED_IN === 'undefined' || LOGGED_IN != 'true'}
- tapOn:
    id: shop_btn_search
- inputText: kaos
- pressKey: Enter
- tapOn:
    id: shop_item_product_open
    index: 0
- tapOn:
    id: shop_btn_add_to_cart
- assertVisible: Ditambahkan ke keranjang
